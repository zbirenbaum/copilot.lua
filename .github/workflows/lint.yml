name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install luarocks -y
          sudo luarocks install luacheck

      - name: Lint
        run: luacheck lua/ --globals vim

  release_automation:
    name: Release automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up release tooling runtime
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pinned release tooling outside repository
        id: release_deps
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/release-please" --no-save --package-lock=false --ignore-scripts release-please@17.6.0
          echo "NODE_PATH=$RUNNER_TEMP/release-please/node_modules" >> "$GITHUB_ENV"
      - name: Test LSP release helper
        run: bash tests/scripts/test_lsp_release.sh
      - name: Test LSP update workflow
        run: bash tests/scripts/test_lsp_update_workflow.sh
      - name: Test LSP metadata generator
        run: bash tests/scripts/test_update_lsp_metadata.sh
      - name: Test ordered release workflows
        run: ruby tests/scripts/test_release_workflow.rb
      - name: Test verified release PR generation
        run: node --test tests/scripts/test_release_pr.cjs
